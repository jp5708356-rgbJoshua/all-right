# 合同规则库（第一版，六类）
#
# 每条规则：id / category / level / pattern / message
# pattern 是 Python 正则，re.MULTILINE 模式；不写 lookbehind，避免可读性差。
# level 只用于排序和标色：高 / 中 / 低
#
# 重要：所有命中结果一律标 needs_human_review = true，由代码强制，
# 本文件里的同名字段只作说明，写 false 也不会生效。
# 本引擎不做语义分析、不调外部模型、不给修改建议。

rules:
  # ---------------- 截止时间 ----------------
  - id: TERM-001
    category: 截止时间
    level: 中
    pattern: '\d+\s*个?工作日内[^。；\n]{0,12}(交付|交货|完成|供货|到货)'
    message: '交付期限按工作日计算，遇节假日顺延，实际可用天数少于自然日，需核对排产是否来得及'

  - id: TERM-002
    category: 截止时间
    level: 高
    pattern: '(尽快|及时|视情况|另行通知|以实际为准)[^。；\n]{0,12}(交付|交货|供货|完成|到货)'
    message: '交付时间表述模糊，没有可考核的具体日期，容易产生争议'

  - id: TERM-003
    category: 截止时间
    level: 中
    pattern: '(合同)?有效期[^。；\n]{0,10}(自动续期|自动延续|自动顺延)'
    message: '存在自动续期条款，需确认续期条件与退出方式'

  # ---------------- 付款条款 ----------------
  - id: PAY-001
    category: 付款条款
    level: 高
    pattern: '(预付|先付|提前支付)[^。；\n]{0,20}(100%|全额|全部货款|全款)'
    message: '全额预付，资金风险高，货物或服务质量无保障时难以追回'

  - id: PAY-002
    category: 付款条款
    level: 高
    pattern: '(\d{3,})\s*(天|日)(内)?[^。；\n]{0,8}(付清|付款|结算|支付)'
    message: '账期超过 100 天，占用资金周期过长，需确认现金流能否承受'

  - id: PAY-003
    category: 付款条款
    level: 中
    pattern: '(甲方|买方|需方)[^。；\n]{0,12}(有权|可)[^。；\n]{0,12}(决定|调整|变更)[^。；\n]{0,12}(付款|账期|结算)'
    message: '付款条件由对方单方决定，缺少对等约束'

  # ---------------- 质保与服务 ----------------
  - id: WAR-001
    category: 质保与服务
    level: 中
    pattern: '质保期?[^。；\n]{0,10}?(?<![\d.])([1-8]?\d)\s*(天|日)(?![\d.])'
    message: '质保期不足 90 天，对生产用料偏短，需评估是否够覆盖一个使用周期'

  - id: WAR-002
    category: 质保与服务
    level: 高
    pattern: '(不承担|不提供|免除)[^。；\n]{0,10}(保修|质保|质量保证|售后服务)'
    message: '对方明确不承担质保责任，出现质量问题将无法追责'

  # ---------------- 数据安全与隐私 ----------------
  - id: SEC-001
    category: 数据安全与隐私
    level: 高
    pattern: '(有权|可以|可将)[^。；\n]{0,15}(数据|信息)[^。；\n]{0,15}(用于|提供给|共享给)[^。；\n]{0,10}(第三方|关联公司|其他方)'
    message: '允许将数据用于第三方或关联公司，存在数据外流风险'

  - id: SEC-002
    category: 数据安全与隐私
    level: 高
    pattern: '(无需|不承担|不负|不履行)[^。；\n]{0,8}保密'
    message: '对方不承担保密义务，商业信息与价格体系可能泄露'

  - id: SEC-003
    category: 数据安全与隐私
    level: 中
    pattern: '保密(义务|期限|责任)[^。；\n]{0,10}(终止|届满|到期)[^。；\n]{0,10}(即)?(解除|失效|终止)'
    message: '保密义务随合同终止而失效，合作结束后信息不再受保护'

  # ---------------- 违约与责任 ----------------
  - id: LIA-001
    category: 违约与责任
    level: 中
    pattern: '违约金[^。；\n]{0,20}([3-9]\d|1\d{2})\s*%'
    message: '违约金比例达 30% 及以上，需核对是否超过实际损失，过高可能不被支持'

  - id: LIA-002
    category: 违约与责任
    level: 高
    pattern: '(甲方|乙方|买方|卖方|供方|需方)[^。；\n]{0,12}(不承担[^。；\n]{0,10}责任|免于承担[^。；\n]{0,10}责任|概不负责)'
    # 「因对方自身原因 / 不可抗力造成的损失免责」属于合理条款，跳过
    exclude: '(自身原因|自身过错|甲方原因|乙方原因|不可抗力|第三方原因)'
    message: '存在单方免责表述，需人工判断免责范围是否合理（若仅限对方自身原因造成的情形，风险较低）'

  - id: LIA-003
    category: 违约与责任
    level: 中
    pattern: '(赔偿|违约责任|损失)[^。；\n]{0,15}(不超过|上限为|以.{0,8}为限)'
    message: '赔偿责任设有上限，大额损失可能无法全额追偿'

  # ---------------- 供应商资质 ----------------
  - id: QUA-001
    category: 供应商资质
    level: 中
    pattern: '(具备|拥有|具有)[^。；\n]{0,10}(相应|相关|必要)[^。；\n]{0,6}(资质|资格)'
    message: '资质要求只写"相应/相关"，未列明具体证照名称与等级，履约时难以核验'

  - id: QUA-002
    category: 供应商资质
    level: 高
    pattern: '资质[^。；\n]{0,10}(失效|过期|被吊销)[^。；\n]{0,12}(不(另行)?通知|无需通知|不必通知)'
    message: '资质失效无需通知，出现合规断档时无法及时止损'

  - id: QUA-003
    category: 供应商资质
    level: 中
    pattern: '(资质|证照|许可)[^。；\n]{0,10}(复印件|扫描件)[^。；\n]{0,10}(即可|作为|视为)'
    message: '仅以复印件作为资质证明，未约定原件核验或有效期跟踪'
